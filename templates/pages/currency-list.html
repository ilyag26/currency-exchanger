<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Currency</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</head>
<body>
    <div class="conteiner">
        <div class="main">
            <h1 class="display-4">Available currencies:</h1>
            <hr>
            <h5>Json response:</h5>
            <div class="alert alert-primary" role="alert">{{data}}</div>
            <h5>Formated result:</h5>
            <div class="content">
                {% for content in data %}
                <ul>
                    <li style="font-weight: bold;">Id: {{content.id}}</li>
                    <li>Code: {{content.code}}</li>
                    <li>Name: {{content.fullname}}</li>
                    <li>Sign: {{content.sign}}</li>
                </ul>

                <a href="/currency_delete?id={{content.id}}"><img src="{{ url_for('static', filename='img/delete.png') }}" style="width:3%; height:3%;"></a>
                
                <hr class="my-4">
                {% endfor %}
            </div>
        <a href="/"><button class="btn btn-primary">Back</button></a>
        </div>
    </div>
</body>
</html>
